version: "3.9"

# S1 controlled-simulation pilot topology (plan Section 6.1), scaled down for
# local development. One Postgres server hosts four separate databases with
# distinct least-privilege roles (ADR-002); this is a known common-infra
# failure domain, not proof of physical isolation, exactly as the plan says.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cassandre_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only_change_me
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    volumes:
      - cassandre_pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: cassandre_keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev_only_change_me
    ports:
      - "58080:8080"
    volumes:
      - ./keycloak-realm-cassandre-sim.json:/opt/keycloak/data/import/keycloak-realm-cassandre-sim.json:ro
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    name: cassandre_sim_net

volumes:
  cassandre_pg_data:
