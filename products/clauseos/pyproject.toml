[project]
name = "clauseos"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "money_types",
  "audit_protocol",
  "cassandre_contracts",
  "cassandre_security",
  "sqlalchemy>=2.0",
  "pypdf>=4.3",
  "pdfplumber>=0.11",
  "pytesseract>=0.3.10",
  "httpx>=0.27",
  "psycopg2-binary>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clauseos"]
