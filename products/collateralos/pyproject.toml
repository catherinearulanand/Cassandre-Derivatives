[project]
name = "collateralos"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "money_types",
  "audit_protocol",
  "cassandre_contracts",
  "cassandre_security",
  "simulation_factory",
  "sqlalchemy>=2.0",
  "scipy>=1.13",
  "psycopg2-binary>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collateralos"]
