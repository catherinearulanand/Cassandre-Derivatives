[project]
name = "riskos"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "money_types",
  "audit_protocol",
  "cassandre_contracts",
  "cassandre_security",
  "simulation_factory",
  "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskos"]
