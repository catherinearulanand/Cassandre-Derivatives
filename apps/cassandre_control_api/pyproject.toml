[project]
name = "cassandre_control_api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cassandre_contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cassandre_control_api"]
