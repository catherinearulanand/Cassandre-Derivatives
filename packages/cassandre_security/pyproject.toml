[project]
name = "cassandre_security"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "audit_protocol",
  "cassandre_contracts",
  "cryptography>=42.0",
  "sqlalchemy>=2.0",
  "quantcrypt>=1.0.1",
  "shamir-mnemonic>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cassandre_security"]
